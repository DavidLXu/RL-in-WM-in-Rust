[workspace]
members = ["env", "rl", "world", "cli", "bench"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
repository = "https://github.com/DavidLXu/RL-in-WM-in-Rust"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1.10"
push-env = { path = "env" }
push-rl = { path = "rl" }
push-world = { path = "world" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[profile.bench]
inherits = "release"
