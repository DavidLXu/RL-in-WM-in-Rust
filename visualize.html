<!doctype html>
<meta charset="utf-8">
<title>RL-in-WM-in-Rust · replay and world-model comparison</title>
<style>
:root{font:14px system-ui,sans-serif;color:#e9edf5;background:#10131a}body{max-width:1220px;margin:24px auto;padding:0 18px}h1{font-size:20px;margin-bottom:6px}h2{font-size:15px;margin:12px 0 4px}.hint{color:#9aa8bd;line-height:1.45}code{color:#d5e6ff}.files{display:flex;gap:10px;flex-wrap:wrap;align-items:center;background:#171d28;border:1px solid #2c3749;border-radius:8px;padding:10px;margin:12px 0}.files label{display:flex;gap:6px;align-items:center}.controls{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin:10px 0}.controls label,button,select,input{margin:4px 7px 4px 0}button,select{background:#252e3d;color:#eef;border:1px solid #52617a;border-radius:5px;padding:5px 9px}button:disabled,select:disabled,input:disabled{opacity:.5}.metrics{display:flex;gap:14px;flex-wrap:wrap;color:#b9c6db;background:#171d28;border-radius:7px;padding:8px;margin:8px 0}.panels{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.panel{min-width:0}.panel.hidden{display:none}.panel-title{color:#b9c6db;margin:3px 0}.canvas-wrap{position:relative}.canvas-wrap canvas{display:block;width:100%;aspect-ratio:4/3;background:#19202b;border:1px solid #3a465a;border-radius:10px}.charts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:14px}.chart{width:100%;height:145px;background:#171d28;border:1px solid #2c3749;border-radius:8px}.status{color:#9fe3b7;min-height:1.3em}@media(max-width:760px){.panels,.charts{grid-template-columns:1fr}.files{display:block}.files label{margin:4px 0}}
</style>
<h1>RL-in-WM-in-Rust · policy replay and world-model comparison</h1>
<p class="hint">加载真实环境评估轨迹，或者再加载一个 world-model 对比文件。两边使用同一 episode/frame 时会并排显示；训练曲线可以从 JSON 或 JSONL metrics 文件加载。旧版 <code>runs/eval.json</code> 仍然兼容。</p>
<div class="files">
  <label>评估/真实轨迹 <input id="file" type="file" accept="application/json,.json"></label>
  <label>真实 vs world model <input id="compareFile" type="file" accept="application/json,.json,.jsonl"></label>
  <label>训练 metrics <input id="metricsFile" type="file" accept="application/json,.json,.jsonl"></label>
</div>
<div class="status" id="status">尚未加载文件</div>
<div class="controls">
  <label>Episode <select id="episode" disabled></select></label>
  <button id="play" disabled>播放</button><button id="pause" disabled>暂停</button>
  <label>Frame <input id="frame" type="range" min="0" max="0" value="0" disabled></label>
</div>
<div class="metrics" id="metrics">请先加载评估轨迹</div>
<div class="panels">
  <div class="panel" id="realPanel"><div class="panel-title">真实仿真器</div><div class="canvas-wrap"><canvas id="canvas" width="800" height="600"></canvas></div></div>
  <div class="panel hidden" id="modelPanel"><div class="panel-title">World model 预测</div><div class="canvas-wrap"><canvas id="modelCanvas" width="800" height="600"></canvas></div></div>
</div>
<div class="metrics" id="comparisonMetrics">加载对比文件后显示 prediction error / uncertainty</div>
<div class="charts"><canvas class="chart" id="returnChart" width="500" height="180"></canvas><canvas class="chart" id="successChart" width="500" height="180"></canvas><canvas class="chart" id="rewardChart" width="500" height="180"></canvas></div>
<script>
const file=document.querySelector('#file'), compareFile=document.querySelector('#compareFile'), metricsFile=document.querySelector('#metricsFile');
const epSel=document.querySelector('#episode'), frame=document.querySelector('#frame'), play=document.querySelector('#play'), pause=document.querySelector('#pause');
const statusEl=document.querySelector('#status'), metricsEl=document.querySelector('#metrics'), comparisonEl=document.querySelector('#comparisonMetrics');
const canvas=document.querySelector('#canvas'), modelCanvas=document.querySelector('#modelCanvas'), realPanel=document.querySelector('#realPanel'), modelPanel=document.querySelector('#modelPanel');
const charts={return:document.querySelector('#returnChart'),success:document.querySelector('#successChart'),reward:document.querySelector('#rewardChart')};
const ctx=canvas.getContext('2d'), modelCtx=modelCanvas.getContext('2d');
let report=null, compare=null, metricRows=[], episode=null, compareEpisode=null, timer=null;
const base={x:-1.15,y:-.55}, arm=[1.05,.95];
let view={cx:base.x,cy:base.y,scale:170}, modelView=view;
function xy(p){if(Array.isArray(p))return [Number(p[0])||0,Number(p[1])||0];if(p&&typeof p==='object')return [Number(p.x)||0,Number(p.y)||0];return [0,0]}
function stateArray(s){if(Array.isArray(s))return s;if(s&&Array.isArray(s.state))return s.state;if(s&&s.state&&typeof s.state==='object')return stateArray(s.state);if(s&&typeof s==='object'){return [s.q0||s.joint0||0,s.q1||s.joint1||0,s.qv0||0,s.qv1||0,s.block_x??s.blockX??s.block?.x??0,s.block_y??s.blockY??s.block?.y??0,s.block_vx??0,s.block_vy??0,s.block_angle??0,s.block_angular_velocity??0,0,0,0,0,s.goal_x??s.goal?.x??0,s.goal_y??s.goal?.y??0,0,0]}return []}
function pointsForState(s){const a=stateArray(s),q0=Number(a[0])||0,q1=Number(a[1])||0;const e=[base.x+arm[0]*Math.cos(q0),base.y+arm[0]*Math.sin(q0)],t=[e[0]+arm[1]*Math.cos(q0+q1),e[1]+arm[1]*Math.sin(q0+q1)];return {a,e,t,b:[Number(a[4])||0,Number(a[5])||0],g:[Number(a[14])||0,Number(a[15])||0]}}
function px(p,v=view,c=canvas){const [x,y]=xy(p);return [c.width/2+(x-v.cx)*v.scale,c.height/2-(y-v.cy)*v.scale]}
function fitView(states,c=canvas){const ps=[xy(base)];for(const s of states||[]){const p=pointsForState(s);ps.push(p.e,p.t,p.b,p.g)}if(ps.length<2)return view;const xs=ps.map(p=>p[0]),ys=ps.map(p=>p[1]),minX=Math.min(...xs),maxX=Math.max(...xs),minY=Math.min(...ys),maxY=Math.max(...ys),pad=.32,spanX=Math.max(.8,maxX-minX+2*pad),spanY=Math.max(.8,maxY-minY+2*pad);return {cx:(minX+maxX)/2,cy:(minY+maxY)/2,scale:Math.min((c.width-70)/spanX,(c.height-70)/spanY)}}
function line(c,v,a,b,color,width){c.strokeStyle=color;c.lineWidth=width;c.beginPath();c.moveTo(...px(a,v,c.canvas));c.lineTo(...px(b,v,c.canvas));c.stroke()}
function drawScene(c,v,s,i,title,extra){c.clearRect(0,0,c.canvas.width,c.canvas.height);c.fillStyle='#19202b';c.fillRect(0,0,c.canvas.width,c.canvas.height);if(!s){c.fillStyle='#a9b7cd';c.font='16px system-ui';c.fillText('没有可用状态',20,30);return}const p=pointsForState(s),goal=px(p.g,v,c.canvas),block=px(p.b,v,c.canvas);c.strokeStyle='#75e0a1';c.lineWidth=3;c.beginPath();c.arc(goal[0],goal[1],12,0,Math.PI*2);c.stroke();c.fillStyle='#f4b65c';c.fillRect(block[0]-10,block[1]-10,20,20);line(c,v,base,p.e,'#0b1019',24);line(c,v,base,p.e,'#7399d8',16);line(c,v,p.e,p.t,'#0b1019',22);line(c,v,p.e,p.t,'#b5c8ef',14);for(const [q,col,r] of [[base,'#eef',11],[p.e,'#f0a85b',8],[p.t,'#f5f7ff',7]]){const z=px(q,v,c.canvas);c.fillStyle=col;c.beginPath();c.arc(z[0],z[1],r,0,Math.PI*2);c.fill()}c.fillStyle='#dce6f7';c.font='12px system-ui';for(const [label,q] of [['base',base],['elbow',p.e],['tip',p.t]]){const z=px(q,v,c.canvas);c.fillText(label,z[0]+10,z[1]-10)}c.fillStyle='#c9d4e8';c.font='14px system-ui';c.fillText(`${title} · frame ${i+1}`,18,26);if(extra){c.fillStyle='#b9c6db';c.font='12px system-ui';extra.slice(0,3).forEach((x,j)=>c.fillText(x,18,47+j*17))}}
function selectedStates(){return realStates(episode)}
function choose(){if(!report||!report.episodes?.length)return;episode=report.episodes[Number(epSel.value)]||report.episodes[0];compareEpisode=compare?.episodes?.[Number(epSel.value)]||null;const rs=selectedStates();const ms=compareStates(compareEpisode);view=fitView(rs.concat(ms));modelView=view;frame.max=Math.max(0,Math.max(rs.length,ms.length)-1);frame.disabled=false;play.disabled=false;pause.disabled=false;draw(0);updateMetrics();drawCharts()}
function compareStates(e){if(!e)return[];const nested=e.world_model||e.world||e.model||e.prediction||{};return e.model_states||e.predicted_states||e.world_states||e.world_model_states||e.predictions||e.predicted||nested.states||nested.model_states||nested.predicted_states||[]}
function realStates(e){if(!e)return[];const nested=e.real||e.simulator||e.ground_truth||{};return e.real_states||e.ground_truth_states||e.states||nested.states||nested.real_states||[]}
function draw(i=0){if(!episode)return;const rs=selectedStates(),ms=compareStates(compareEpisode),n=Math.max(rs.length,ms.length);i=Math.max(0,Math.min(i,n-1));frame.value=i;const r=rs[i]||rs[rs.length-1],m=ms[i]||ms[ms.length-1];drawScene(ctx,view,r,i,'真实仿真器',[]);if(compareEpisode){realPanel.classList.remove('hidden');modelPanel.classList.remove('hidden');const err=stateError(r,m),unc=uncertaintyAt(compareEpisode,i);drawScene(modelCtx,modelView,m,i,'World model',[(err==null?'':'block error '+err.toFixed(4)),(unc==null?'':'uncertainty '+unc.toFixed(4))]);comparisonEl.textContent=`frame=${i+1} · block error=${err==null?'—':err.toFixed(4)} · tip error=${tipError(r,m)==null?'—':tipError(r,m).toFixed(4)} · uncertainty=${unc==null?'—':unc.toFixed(4)}`}else{modelPanel.classList.add('hidden');comparisonEl.textContent='加载对比文件后显示 prediction error / uncertainty'}}
function stateError(a,b){if(!a||!b)return null;const x=stateArray(a),y=stateArray(b);if(x.length<6||y.length<6)return null;return Math.hypot((x[4]||0)-(y[4]||0),(x[5]||0)-(y[5]||0))}
function tipError(a,b){if(!a||!b)return null;const p=pointsForState(a),q=pointsForState(b);return Math.hypot(p.t[0]-q.t[0],p.t[1]-q.t[1])}
function uncertaintyAt(e,i){const u=e?.uncertainty||e?.uncertainties||e?.model_uncertainty||e?.world_model?.uncertainty||e?.world_model?.uncertainties;return Array.isArray(u)?Number(u[Math.min(i,u.length-1)]):Number.isFinite(Number(u))?Number(u):null}
function updateMetrics(){if(!episode)return;const m=report.metrics||{},ret=Number(episode.return),states=selectedStates();metricsEl.textContent=`algorithm=${report.algorithm||'unknown'} · success=${episode.success} · return=${Number.isFinite(ret)?ret.toFixed(2):'—'} · steps=${episode.steps??states.length??'—'} · min distance=${Number(episode.min_distance).toFixed(3)} · final distance=${Number(episode.final_distance).toFixed(3)} · aggregate success=${m.success_rate==null?'—':(100*Number(m.success_rate)).toFixed(1)+'%'}`}
function parseMetricText(t){const s=t.trim();if(!s)return[];try{const v=JSON.parse(s);if(Array.isArray(v))return v;if(Array.isArray(v.metrics))return v.metrics;if(Array.isArray(v.history))return v.history;return [v]}catch(_){return s.split(/\r?\n/).map(x=>{try{return JSON.parse(x)}catch(_){return null}}).filter(Boolean)}}
function metricValue(r,keys){for(const k of keys){if(r&&r[k]!=null&&Number.isFinite(Number(r[k])))return Number(r[k])}return null}
function derivedRows(){if(!report?.episodes)return[];return report.episodes.map((e,i)=>({step:i+1,return:Number(e.return)||0,success:e.success?1:0,reward:Number(e.return)||0}))}
function drawChart(c,rows,keys,label,color){const g=c.getContext('2d');g.clearRect(0,0,c.width,c.height);g.fillStyle='#171d28';g.fillRect(0,0,c.width,c.height);g.fillStyle='#b9c6db';g.font='13px system-ui';g.fillText(label,12,19);const vals=rows.map(r=>metricValue(r,keys)).filter(v=>v!=null);if(!vals.length){g.fillStyle='#75839a';g.font='12px system-ui';g.fillText('没有可用 metrics',12,42);return}const min=Math.min(...vals),max=Math.max(...vals),span=max-min||1,left=34,right=c.width-12,top=30,bottom=c.height-24;g.strokeStyle='#37465b';g.lineWidth=1;g.beginPath();g.moveTo(left,top);g.lineTo(left,bottom);g.lineTo(right,bottom);g.stroke();g.strokeStyle=color;g.lineWidth=2;let started=false;rows.forEach((r,i)=>{const v=metricValue(r,keys);if(v==null)return;const x=left+(rows.length<=1?0:(i/(rows.length-1))*(right-left)),y=bottom-(v-min)/span*(bottom-top);if(!started){g.beginPath();g.moveTo(x,y);started=true}else g.lineTo(x,y)});if(started)g.stroke();g.fillStyle='#75839a';g.font='10px system-ui';g.fillText(max.toFixed(2),2,top+3);g.fillText(min.toFixed(2),2,bottom)}
function drawCharts(){const rows=metricRows.length?metricRows:derivedRows();drawChart(charts.return,rows,['return','episode_return','mean_return','eval_return'],'Return','#7bb7ff');drawChart(charts.success,rows,['success_rate','success','eval_success_rate'],'Success rate','#75e0a1');drawChart(charts.reward,rows,['reward','mean_reward','episode_reward','loss','train_mse'],'Reward / model metric','#f4b65c')}
function readJson(fileObj,cb){const r=new FileReader();r.onload=()=>{try{cb(JSON.parse(r.result),null)}catch(e){cb(null,e)}};r.readAsText(fileObj)}
file.onchange=()=>{const f=file.files[0];if(!f)return;readJson(f,(v,e)=>{if(e){statusEl.textContent='评估文件解析失败：'+e.message;return}report=v;epSel.innerHTML='';(report.episodes||[]).forEach((_,i)=>{const o=document.createElement('option');o.value=i;o.textContent=i;epSel.append(o)});epSel.disabled=!(report.episodes||[]).length;statusEl.textContent=`已加载轨迹：${f.name} · ${report.episodes?.length||0} episodes`;choose()})};
compareFile.onchange=()=>{const f=compareFile.files[0];if(!f)return;readJson(f,(v,e)=>{if(e){statusEl.textContent='对比文件解析失败：'+e.message;return}compare=v;statusEl.textContent=`已加载对比：${f.name}`;if(report)choose()})};
metricsFile.onchange=()=>{const f=metricsFile.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{metricRows=parseMetricText(r.result);statusEl.textContent=`已加载 metrics：${f.name} · ${metricRows.length} records`;drawCharts()};r.readAsText(f)};
epSel.onchange=choose;frame.oninput=()=>draw(Number(frame.value));play.onclick=()=>{clearInterval(timer);timer=setInterval(()=>{const n=Number(frame.value)+1;if(n>=Math.max(selectedStates().length,compareStates(compareEpisode).length)){clearInterval(timer);return}draw(n)},70)};pause.onclick=()=>clearInterval(timer);drawCharts();
</script>
